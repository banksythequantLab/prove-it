<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faraday</title>
<style>
:root{
  --bg:#0c0e12; --panel:#13161d; --panel2:#181c25; --line:#252b37;
  --ink:#e8ebf0; --dim:#8b94a6; --accent:#5b9cff;
  --ok:#2fbf71; --warn:#f0a93b; --bad:#f0544f; --priv:#b06cf5;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel)}
h1{margin:0;font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
h1 em{color:var(--dim);font-weight:400;letter-spacing:.02em;text-transform:none;
  font-size:13px;margin-left:10px;font-style:normal}
.pill{font:600 11px/1 var(--mono);padding:6px 10px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.on{color:var(--ok);border-color:#1d4d35;background:#0f2419}
.pill.off{color:var(--bad);border-color:#53241f;background:#24100f}
.banner{margin:0;padding:12px 24px;background:#2a1410;border-bottom:1px solid #53241f;
  color:#ffb4ae;font:500 13px/1.4 var(--mono);display:none}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1px;
  background:var(--line);min-height:calc(100vh - 61px)}
section{background:var(--bg);padding:20px 24px;min-width:0}
h2{margin:0 0 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:650}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  font-size:13px;vertical-align:top}
th{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:650}
tr.poison td{background:#1d1210}
code,.mono{font-family:var(--mono);font-size:12px}
.tag{display:inline-block;font:600 10px/1 var(--mono);padding:4px 7px;border-radius:4px;
  border:1px solid var(--line);color:var(--dim)}
.tag.privileged{color:var(--priv);border-color:#40246b;background:#190f28}
.tag.responsive{color:var(--accent);border-color:#1e3a66;background:#0d1626}
.tag.neither{color:var(--dim)}
.tag.bad{color:var(--bad);border-color:#53241f;background:#24100f}
.tag.ok{color:var(--ok);border-color:#1d4d35;background:#0f2419}
button{font:600 12px/1 inherit;padding:7px 12px;border-radius:6px;cursor:pointer;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:#14284a;border-color:#1e3a66;color:#cfe0ff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:12px}
.card.alarm{border-color:#53241f;background:#1b100e}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.shadow{font-family:var(--mono);font-size:12px;color:#ffb4ae;background:#140b0a;
  border-left:3px solid var(--bad);padding:10px 12px;border-radius:0 5px 5px 0;
  white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto}
.log{font-family:var(--mono);font-size:12px;max-height:320px;overflow:auto}
.log div{padding:6px 8px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:baseline}
.log b{color:var(--bad);flex:none}
.log i{color:var(--dim);font-style:normal;flex:none}
.chain{font-family:var(--mono);font-size:11px;max-height:260px;overflow:auto}
.chain div{padding:5px 8px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.chain .ev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chain .alarm{color:var(--bad)}
.empty{color:var(--dim);font-style:italic;padding:14px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{color:var(--dim);font-size:12px;margin:0 0 6px}
.warn{color:var(--warn);font-size:12px;margin:10px 0 0}
@media(max-width:1000px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Faraday <em>contained document review</em></h1>
  <span class="pill" id="p-cage">cage &middot; checking</span>
  <span class="pill" id="p-model">model &middot; checking</span>
  <span class="pill" id="p-chain">chain &middot; checking</span>
</header>
<p class="banner" id="banner"></p>

<main>
  <section>
    <h2>Review queue</h2>
    <div class="row">
      <button id="btn-all" class="primary">Review all</button>
      <button id="btn-poison">Review poisoned only</button>
      <span class="mono" id="queue-note" style="color:var(--dim)"></span>
    </div>
    <table>
      <thead><tr><th>Bates</th><th>Title</th><th>Truth</th><th>Verdict</th><th></th></tr></thead>
      <tbody id="queue"><tr><td colspan="5" class="empty">loading corpus&hellip;</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>Containment</h2>
    <div id="findings"><div class="empty">No review run yet.</div></div>

    <h2 style="margin-top:22px">Containment log <span id="egress-n" class="tag"></span></h2>
    <div class="log" id="egress"><div class="empty">No egress attempts recorded.</div></div>

    <h2 style="margin-top:22px">Audit chain</h2>
    <div class="chain" id="chain"><div class="empty">empty</div></div>
  </section>
</main>

<script>
const q = (s) => document.querySelector(s);
const esc = (s) => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let corpus = [], results = {};

async function api(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function health() {
  const h = await api('/api/health');
  const cage = q('#p-cage');
  cage.textContent = 'cage · ' + (h.docker_daemon ? 'sealed' : 'DEGRADED');
  cage.className = 'pill ' + (h.docker_daemon ? 'on' : 'off');
  const m = q('#p-model');
  m.textContent = 'model · ' + (h.text_model ? h.text_model : 'unset');
  m.className = 'pill ' + (h.text_model ? 'on' : 'off');
  if (h.warning) { q('#banner').style.display = 'block'; q('#banner').textContent = '⚠ ' + h.warning; }
  else { q('#banner').style.display = 'none'; }
}

async function loadCorpus() {
  const c = await api('/api/corpus');
  if (!c.ok) { q('#queue').innerHTML = '<tr><td colspan="5" class="empty">' + esc(c.error) + '</td></tr>'; return; }
  corpus = c.documents;
  q('#queue-note').textContent = corpus.length + ' docs · '
    + corpus.filter((d) => d.poisoned).length + ' poisoned';
  renderQueue();
}

function renderQueue() {
  q('#queue').innerHTML = corpus.map((d) => {
    const r = results[d.doc_id];
    let verdict = '<span class="tag">—</span>';
    if (r) {
      const lab = r.classification ? r.classification.label : null;
      verdict = lab ? '<span class="tag ' + esc(lab) + '">' + esc(lab) + '</span>'
                    : '<span class="tag">no model</span>';
      if (r.quarantined) verdict += ' <span class="tag bad">QUARANTINED</span>';
    }
    return '<tr class="' + (d.poisoned ? 'poison' : '') + '">'
      + '<td class="mono">' + esc(d.doc_id) + '</td>'
      + '<td>' + esc(d.title) + '</td>'
      + '<td><span class="tag ' + esc(d.label) + '">' + esc(d.label) + '</span>'
      + (d.poisoned ? ' <span class="tag bad">' + esc(d.poison_technique) + '</span>' : '') + '</td>'
      + '<td>' + verdict + '</td>'
      + '<td><button data-doc="' + esc(d.doc_id) + '">Review</button></td></tr>';
  }).join('');
  document.querySelectorAll('#queue button[data-doc]').forEach((b) => {
    b.onclick = () => review(b.dataset.doc, b);
  });
}

async function review(docId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const fd = new FormData();
  fd.append('doc_id', docId);
  const r = await api('/api/review', { method: 'POST', body: fd });
  results[docId] = r;
  renderQueue();
  renderFindings(r);
  refresh();
}

function renderFindings(r) {
  const doc = corpus.find((d) => r.source && r.source.indexOf(d.doc_id) !== -1) || {};
  let html = '';

  if (r.injection_suspected) {
    html += '<div class="card alarm">'
      + '<h3>⚠ Prompt injection contained — ' + esc(doc.doc_id) + '</h3>'
      + '<p style="margin:0 0 10px">'
      + '<span class="tag bad">' + esc((r.techniques || []).join(', ')) + '</span> '
      + '<span class="tag">' + r.shadow_text.length + ' shadow chars</span> '
      + (r.contained ? '<span class="tag ok">cage sealed</span>'
                     : '<span class="tag bad">UNCONTAINED RUN</span>')
      + '</p>'
      + '<p class="note">Text present in the extraction layer and absent from the '
      + 'rendered page — the agent would have read this, the reviewer never would:</p>'
      + '<div class="shadow">' + esc(r.shadow_text) + '</div>'
      + '</div>';
  }

  const c = r.classification;
  html += '<div class="card">'
    + '<h3>Classification — ' + esc(doc.doc_id) + '</h3>';
  if (c) {
    html += '<p style="margin:0 0 6px">'
      + '<span class="tag ' + esc(c.label) + '">' + esc(c.label) + '</span> '
      + '<span class="tag">conf ' + esc(c.confidence) + '</span> '
      + (c.injection_noted ? '<span class="tag bad">model noticed the injection</span>' : '')
      + '</p><p class="note">' + esc(c.rationale) + '</p>';
  } else {
    html += '<p class="empty" style="padding:0">No model configured — structural pass only. '
      + 'Set FARADAY_TEXT_MODEL from <code>/api/models</code>.</p>';
  }
  if (r.vision) {
    html += '<p style="margin:8px 0 0">'
      + '<span class="tag ' + (r.vision.confirmed ? 'bad' : '') + '">vision '
      + (r.vision.confirmed ? 'CONFIRMED invisible' : 'inconclusive') + '</span> '
      + '<span class="tag">' + Math.round(r.vision.ratio * 100)
      + '% of shadow words unseen on the page</span></p>';
  }
  html += '<p class="note mono" style="margin:10px 0 0">sha256 '
    + esc(r.sha256.slice(0, 32)) + '…</p>';
  if (r.quarantined) {
    html += '<div class="row" style="margin:12px 0 0">'
      + '<button class="primary" id="approve">Approve release (human gate)</button>'
      + '<span class="mono" style="color:var(--dim)">agent cannot release a quarantined document</span>'
      + '</div>';
  }
  if ((r.errors || []).length) {
    html += '<p class="warn">' + r.errors.map(esc).join('<br>') + '</p>';
  }
  html += '</div>';

  q('#findings').innerHTML = html;
  const ap = q('#approve');
  if (ap) {
    ap.onclick = async () => {
      const fd = new FormData();
      fd.append('approver', 'dj@soltis.info');
      const u = await api('/api/review/' + r.job_id + '/approve', { method: 'POST', body: fd });
      results[doc.doc_id] = u;
      renderFindings(u);
      refresh();
    };
  }
}

async function refresh() {
  const e = await api('/api/containment');
  q('#egress-n').textContent = e.count + ' blocked';
  q('#egress').innerHTML = e.count
    ? e.attempts.slice().reverse().map((a) =>
        '<div><b>BLOCKED</b><i>' + esc(a.kind) + '</i><span>'
        + esc(a.host || '?') + esc(a.path || '')
        + (a.body_bytes ? ' <i>(' + a.body_bytes + 'B body)</i>' : '')
        + '</span></div>').join('')
    : '<div class="empty">No egress attempts recorded.</div>';

  const c = await api('/api/audit');
  const v = c.verification;
  const pc = q('#p-chain');
  pc.textContent = 'chain · ' + (v.valid ? v.checked + ' verified' : 'BROKEN @' + v.broken_at);
  pc.className = 'pill ' + (v.valid ? 'on' : 'off');
  q('#chain').innerHTML = c.entries.length
    ? c.entries.slice().reverse().map((x) =>
        '<div><i style="color:var(--dim)">' + String(x.seq).padStart(3, '0') + '</i>'
        + '<span class="ev ' + (/DETECTED|DEGRADED/.test(x.event) ? 'alarm' : '') + '">'
        + esc(x.event) + '</span>'
        + '<i style="color:var(--dim)">' + esc(x.hash.slice(0, 10)) + '</i></div>').join('')
    : '<div class="empty">empty</div>';
}

q('#btn-all').onclick = async (e) => {
  e.target.disabled = true;
  for (const d of corpus) await review(d.doc_id, null);
  e.target.disabled = false;
};
q('#btn-poison').onclick = async (e) => {
  e.target.disabled = true;
  for (const d of corpus.filter((x) => x.poisoned)) await review(d.doc_id, null);
  e.target.disabled = false;
};

health();
loadCorpus();
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
